<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Museum Wiki</title>
    <meta name="description" content="Internes Wissenssystem für Fehlerbehebungen und Anleitungen zu Stationen und Anlagen im Museum." />
    <link rel="icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Museum Wiki" />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script type="text/javascript">
      // Übersetzt den von 404.html umgeleiteten Pfad zurück in eine normale
      // Adresse, damit React Router sie korrekt übernimmt.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body class="bg-neutral-950 text-neutral-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
